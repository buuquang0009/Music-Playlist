<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Music Player</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">

    <div class="profile">
        <div class="top-row">
            <div class="avatar">🎵</div>
            picture/sf.jpg
        </div>

        <h2>My Playlist</h2>

        <div class="author-credit">
            Lyrics Hong Nguyen <br>
            & <br>
            AI by Qui Huynh
        </div>
    </div>

    <!-- ===== 2026 ===== -->
    <div class="year-box">
        <h3>2026</h3>
        <ul class="playlist playlist-2026"></ul>
    </div>

    <!-- ===== DANH SÁCH GỐC ===== -->
    <ul class="all-songs">

        <li data-year="2026"
            data-name="Vẫn mãi vô tư"
            data-file="Song/Vanmaivotu.mp3">
            <span class="song-name">Vẫn mãi vô tư</span>
            <span class="duration">3:22</span>
        </li>

        <li data-year="2026"
            data-name="Forever Innocent"
            data-file="Song/Foreverinnocent.mp3">
            <span class="song-name">Forever Innocent</span>
            <span class="duration">1:28</span>
        </li>

        <li data-year="2026"
            data-name="Người Việt cao quý"
            data-file="Song/Nguoivietcaoquy.mp3">
            <span class="song-name">Người Việt cao quý</span>
            <span class="duration">5:13</span>
        </li>

        <li data-year="2026"
            data-name="The Noble Hearts of VietNam"
            data-file="Song/TheNobleHeartsofVietNam.mp3">
            <span class="song-name">The Noble Hearts of VietNam</span>
            <span class="duration">6:40</span>
        </li>

        <li data-year="2026"
            data-name="Lời cảm ơn chân thành"
            data-file="Song/Loicamonchanthanh.mp3">
            <span class="song-name">Lời cảm ơn chân thành</span>
            <span class="duration">3:05</span>
        </li>

    </ul>

</div>

<!-- ===== PLAYER ===== -->
    <div class="player">
        <button id="playAllBtn" class="play-all-btn">
            ▶ Play All
        </button>

        <h1 id="songTitle">Chọn bài hát</h1>

        <div class="visual-area">
            <div class="disc-container">
                <img src="picture/chimen.png" class="decor-bird">
                <div class="disc" id="disc">
                    <div class="center"></div>
                </div>
            </div>
            <div id="musicNotes"></div>
        </div>

        <audio id="audioPlayer" controls></audio>
        <img src="picture/hoasen3.png" class="decor-image">
    </div>

<div class="update-label">Last update 09.08.26</div>

<script src="script.js"></script>

</body>
</html>
